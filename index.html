<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRSM Spreadsheet Workshop · Dr. Hafizah Bahaludin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --p50:#F3F1FF;--p100:#E9E6FE;--p200:#D4CFFE;--p300:#B5ACFC;--p400:#9485F8;
  --p500:#7C5FF5;--p600:#6A45F0;--p700:#5A32D6;--p800:#4826B3;--p900:#361A8F;
  --g800:#2A1C6E;--g700:#3D2C8A;
  --mint:#00D4A1;--coral:#FF6B6B;--gold:#F5B700;--sky:#4CC9F0;
  --ink:#1A0E3D;--muted:#7B6BAE;--surface:#FAFAFE;--white:#FFFFFF;
  --r:14px;--rsm:8px;--rlg:20px;--rxl:28px;
  --shadow:0 4px 24px rgba(106,69,240,0.12);
  --font:'Plus Jakarta Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--surface);color:var(--ink);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 80% 60% at 15% -5%,rgba(148,133,248,0.13) 0%,transparent 55%),
             radial-gradient(ellipse 50% 50% at 90% 100%,rgba(76,201,240,0.09) 0%,transparent 55%);
  pointer-events:none;}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 14px 90px;}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--p700) 0%,var(--p500) 55%,#5BC8FF 100%);
  border-radius:var(--rxl);padding:26px 22px 22px;margin-bottom:14px;position:relative;overflow:hidden;}
.hdr::after{content:'';position:absolute;top:-40px;right:-30px;width:150px;height:150px;
  border-radius:50%;background:rgba(255,255,255,0.06);pointer-events:none;}
.hdr-icon{font-size:38px;margin-bottom:8px;display:block;}
.hdr h1{font-size:19px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:4px;}
.hdr-sub{font-size:12px;color:rgba(255,255,255,0.78);}
.hdr-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.hdr-pill{background:rgba(255,255,255,0.17);color:#fff;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:20px;letter-spacing:0.2px;}

/* CARDS */
.card{background:var(--white);border-radius:var(--rlg);padding:18px;margin-bottom:12px;
  border:1.5px solid var(--p100);box-shadow:var(--shadow);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:var(--rsm);border:1.5px solid var(--p200);
  background:var(--white);color:var(--ink);font-family:var(--font);font-size:14px;
  font-weight:600;cursor:pointer;transition:all 0.18s;text-decoration:none;}
.btn:hover{background:var(--p50);border-color:var(--p400);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(135deg,var(--p700),var(--p500));border-color:transparent;
  color:#fff;box-shadow:0 4px 16px rgba(106,69,240,0.35);}
.btn-primary:hover{background:linear-gradient(135deg,var(--p800),var(--p600));
  box-shadow:0 6px 20px rgba(106,69,240,0.45);}
.btn-mint{background:linear-gradient(135deg,#00B88A,var(--mint));border-color:transparent;
  color:#fff;box-shadow:0 4px 14px rgba(0,212,161,0.28);}
.btn-mint:hover{box-shadow:0 6px 18px rgba(0,212,161,0.38);}
.btn-ghost{background:transparent;border-color:var(--p200);color:var(--muted);}
.btn-ghost:hover{background:var(--p50);color:var(--p700);}
.btn-sm{padding:7px 13px;font-size:12px;}
.btn-full{width:100%;margin-top:8px;}

/* FORM */
.field{margin-bottom:13px;}
.label{font-size:11px;font-weight:700;color:var(--p700);text-transform:uppercase;
  letter-spacing:0.6px;margin-bottom:5px;display:block;}
.inp{width:100%;padding:10px 13px;border:1.5px solid var(--p200);border-radius:var(--rsm);
  font-family:var(--font);font-size:14px;color:var(--ink);background:var(--white);
  transition:border-color 0.18s,box-shadow 0.18s;}
.inp:focus{outline:none;border-color:var(--p500);box-shadow:0 0 0 3px rgba(106,69,240,0.11);}
.inp::placeholder{color:#C0B4E8;}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px;}
.kpi{background:var(--p50);border-radius:var(--rsm);padding:13px 8px;text-align:center;border:1.5px solid var(--p100);}
.kpi-val{font-size:21px;font-weight:800;color:var(--p700);line-height:1;}
.kpi-lbl{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600;}

/* PROGRESS */
.prog-wrap{background:var(--p100);border-radius:20px;height:9px;overflow:hidden;}
.prog-bar{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--p600),var(--sky));
  transition:width 0.6s cubic-bezier(.34,1.56,.64,1);}
.prog-meta{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;color:var(--muted);}

/* STEP ITEMS */
.step-item{display:flex;align-items:flex-start;gap:13px;padding:13px 0;
  border-bottom:1.5px dashed var(--p100);}
.step-item:last-child{border-bottom:none;}
.step-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;border:2px solid transparent;}
.sn-done{background:var(--mint);color:#fff;border-color:var(--mint);}
.sn-active{background:linear-gradient(135deg,var(--p600),var(--p400));color:#fff;}
.sn-lock{background:var(--p50);color:var(--muted);border-color:var(--p200);}
.step-title{font-size:14px;font-weight:700;margin-bottom:2px;}
.step-sub{font-size:12px;color:var(--muted);}

/* BADGE GRID */
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px;}
.badge{text-align:center;padding:13px 6px 9px;border-radius:var(--r);
  border:1.5px solid var(--p100);background:var(--p50);
  transition:all 0.25s;position:relative;overflow:hidden;}
.badge::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--p400),var(--sky));opacity:0;transition:opacity 0.25s;}
.badge.earned{border-color:var(--p300);background:linear-gradient(135deg,var(--p50),#EEF0FF);
  box-shadow:0 2px 12px rgba(106,69,240,0.13);}
.badge.earned::before{opacity:1;}
.badge.locked{opacity:0.45;}
.badge-ico{font-size:26px;display:block;margin-bottom:5px;}
.badge-name{font-size:10px;font-weight:700;color:var(--p700);line-height:1.3;}
.badge-tick{font-size:10px;color:var(--mint);font-weight:700;margin-top:3px;}
.trophy-badge{grid-column:span 2;padding:14px;}
.trophy-badge .badge-ico{font-size:36px;}
.trophy-badge .badge-name{font-size:12px;}

/* TEST UI */
.test-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;}
.test-tag{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;
  background:var(--p100);color:var(--p700);}
.q-sec-banner{border-radius:var(--rsm);padding:8px 13px;margin-bottom:14px;
  font-size:11px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;}
.sec-a{background:linear-gradient(90deg,var(--p100),var(--p50));color:var(--p800);}
.sec-b{background:linear-gradient(90deg,rgba(76,201,240,0.15),rgba(76,201,240,0.04));color:#0A6E8A;}
.sec-c{background:linear-gradient(90deg,rgba(255,107,107,0.12),rgba(255,107,107,0.03));color:#7A1515;}
.q-text{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:13px;line-height:1.55;}
.opt{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:var(--rsm);
  border:1.5px solid var(--p100);margin-bottom:7px;cursor:pointer;font-size:13px;
  line-height:1.45;transition:all 0.15s;background:var(--white);}
.opt:hover{border-color:var(--p400);background:var(--p50);}
.opt.selected{border-color:var(--p500);background:linear-gradient(135deg,var(--p50),#EEEEFF);
  box-shadow:0 2px 8px rgba(106,69,240,0.11);}
.opt-letter{width:22px;height:22px;border-radius:6px;background:var(--p100);color:var(--p700);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
  flex-shrink:0;margin-top:1px;}
.opt.selected .opt-letter{background:var(--p600);color:#fff;}
.tf-row{display:flex;gap:9px;margin-top:9px;}
.tf-btn{flex:1;padding:11px;border-radius:var(--rsm);border:1.5px solid var(--p200);
  background:var(--white);font-family:var(--font);font-size:14px;font-weight:700;
  cursor:pointer;transition:all 0.15s;color:var(--muted);}
.tf-btn:hover{border-color:var(--p400);background:var(--p50);color:var(--p700);}
.tf-btn.selected{border-color:var(--p500);background:var(--p100);color:var(--p800);}

/* Q NAVIGATOR */
.q-nav{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px;}
.q-dot{width:29px;height:29px;border-radius:7px;border:1.5px solid var(--p200);
  background:var(--white);color:var(--muted);font-size:11px;font-weight:700;
  cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;}
.q-dot:hover{border-color:var(--p400);color:var(--p600);}
.q-dot.done{background:var(--p100);border-color:var(--p400);color:var(--p700);}
.q-dot.active{background:linear-gradient(135deg,var(--p600),var(--p400));border-color:transparent;color:#fff;}

/* SCORE */
.score-wrap{text-align:center;padding:22px 0 14px;}
.score-ring{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  width:100px;height:100px;border-radius:50%;border:6px solid var(--p500);
  background:var(--p50);margin-bottom:10px;}
.score-num{font-size:26px;font-weight:800;color:var(--p700);}
.score-den{font-size:11px;color:var(--muted);font-weight:600;}
.level-badge{display:inline-block;padding:5px 16px;border-radius:20px;
  font-size:13px;font-weight:700;margin-bottom:5px;}

/* MODULE ROWS */
.mod-row{display:flex;align-items:flex-start;gap:11px;padding:13px 0;
  border-bottom:1.5px dashed var(--p100);}
.mod-row:last-child{border-bottom:none;}
.mod-ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:17px;flex-shrink:0;
  background:linear-gradient(135deg,var(--p100),var(--p50));}
.mod-ico.done{background:linear-gradient(135deg,rgba(0,212,161,0.2),rgba(0,212,161,0.07));}
.mod-title{font-size:13px;font-weight:700;margin-bottom:2px;}
.mod-sub{font-size:11px;color:var(--muted);}
.mod-link-row{display:flex;gap:7px;margin-top:7px;align-items:center;}
.mod-link-inp{flex:1;padding:7px 11px;border-radius:var(--rsm);
  border:1.5px solid var(--p200);font-size:12px;font-family:var(--font);color:var(--ink);}
.mod-link-inp:focus{outline:none;border-color:var(--p500);}
.mod-done-link{font-size:11px;color:var(--p600);margin-top:3px;word-break:break-all;}
.badge-pop{display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(135deg,var(--p600),var(--p400));color:#fff;
  padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-top:7px;
  animation:popIn 0.4s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{opacity:0;transform:scale(0.6);}to{opacity:1;transform:scale(1);}}

/* TRAINER */
.trainer-hdr{background:linear-gradient(135deg,var(--g800),var(--g700));
  border-radius:var(--rlg);padding:18px;margin-bottom:12px;color:#fff;}
.data-table{width:100%;border-collapse:collapse;font-size:12px;}
.data-table th{padding:9px 7px;background:var(--p50);color:var(--p700);font-weight:700;
  text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.4px;
  border-bottom:2px solid var(--p200);}
.data-table td{padding:9px 7px;border-bottom:1px solid var(--p50);color:var(--ink);}
.data-table tr:hover td{background:var(--p50);}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.pill-done{background:rgba(0,212,161,0.13);color:#006649;}
.pill-no{background:var(--p50);color:var(--muted);}
.gain-pos{color:var(--mint);font-weight:700;}
.gain-neg{color:var(--coral);font-weight:700;}

/* TROPHY */
.trophy-screen{background:linear-gradient(135deg,var(--p700) 0%,var(--p500) 50%,var(--sky) 100%);
  border-radius:var(--rxl);padding:30px 22px;text-align:center;margin-bottom:14px;overflow:hidden;}
.trophy-big{font-size:58px;display:block;margin-bottom:10px;
  animation:float 2s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.trophy-screen h2{font-size:20px;font-weight:800;color:#fff;margin-bottom:5px;}
.trophy-screen p{font-size:13px;color:rgba(255,255,255,0.82);}

/* NAV */
.nav-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:520px;z-index:100;
  background:rgba(255,255,255,0.93);backdrop-filter:blur(14px);
  border-top:1.5px solid var(--p100);padding:7px 10px;
  display:flex;gap:5px;}
.nav-btn{flex:1;padding:9px 5px;border-radius:var(--rsm);border:none;background:transparent;
  cursor:pointer;font-family:var(--font);font-size:11px;font-weight:700;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:all 0.15s;}
.nav-btn:hover,.nav-btn.active{color:var(--p700);background:var(--p50);}
.nav-ico{font-size:17px;}

/* ALERTS */
.alert{border-radius:var(--rsm);padding:11px 13px;font-size:13px;margin-top:9px;}
.alert-info{background:var(--p50);border:1.5px solid var(--p200);color:var(--p800);}
.alert-success{background:rgba(0,212,161,0.09);border:1.5px solid rgba(0,212,161,0.28);color:#00604A;}

/* GAIN BAR */
.gain-bar-wrap{margin-top:12px;}
.gain-row{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:12px;}
.gain-label{width:40px;font-weight:700;color:var(--muted);text-align:right;}
.gain-track{flex:1;background:var(--p100);border-radius:20px;height:9px;overflow:hidden;}
.gain-fill{height:100%;border-radius:20px;transition:width 0.6s cubic-bezier(.34,1.56,.64,1);}
.gain-fill-pre{background:linear-gradient(90deg,var(--p400),var(--p300));}
.gain-fill-post{background:linear-gradient(90deg,var(--mint),#009E75);}
.gain-num{width:32px;font-weight:700;}

/* ANIM */
.fade-in{animation:fadeSlide 0.32s ease forwards;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const MODULES=[
  {id:1,name:"Sesi 1",title:"Asas Spreadsheet & Data Entry",day:"Selasa Malam",dur:"2j",ico:"📊"},
  {id:2,name:"Sesi 2",title:"Sort, Filter & Conditional Formatting",day:"Rabu Pagi",dur:"2j",ico:"🔍"},

  {id:5,name:"Sesi 5A+B",title:"Visualization, Pivot & Dashboard",day:"Rabu Petang",dur:"2j",ico:"📈"},
  {id:6,name:"Sesi 5C",title:"Gemini AI dalam Google Sheets",day:"Rabu Petang",dur:"2j",ico:"🤖"},
  {id:7,name:"Sesi 6-7",title:"Case Study & Showcase",day:"Khamis Pagi",dur:"2j",ico:"⭐"},
];
const BADGES=[
  {id:1,ico:"📊",name:"Data Explorer"},{id:2,ico:"🔍",name:"Data Detective"},
  {id:3,ico:"📐",name:"Formula Master"},{id:4,ico:"🔢",name:"Lookup Wizard"},
  {id:5,ico:"📈",name:"Dashboard Pro"},{id:6,ico:"🤖",name:"AI Champion"},
  {id:7,ico:"⭐",name:"Showcase Star"},
];
const QS=[
  {no:1,s:"A",q:"Apakah formula yang betul untuk mengira jumlah markah dalam sel B6, C6 dan D6?",t:"mc",o:["=TOTAL(B6:D6)","=SUM(B6:D6)","=ADD(B6,C6,D6)","=B6+C6,D6"],a:1},
  {no:2,s:"A",q:"Fungsi AutoFill digunakan untuk:",t:"mc",o:["Mewarnakan sel secara automatik","Menjana siri data berjujukan seperti 1,2,3 atau NT001,NT002","Mencari data dalam helaian lain","Mengira purata secara automatik"],a:1},
  {no:3,s:"A",q:"=IF(C6>=50,\"Lulus\",\"Gagal\") akan menghasilkan 'Lulus' apabila:",t:"mc",o:["C6 = 50 sahaja","C6 lebih besar daripada 50","C6 = 50 atau lebih besar","C6 kurang dari 50"],a:2},
  {no:4,s:"A",q:"Freeze Panes membekukan baris header supaya ia sentiasa kelihatan apabila menatal ke bawah.",t:"tf",a:"benar"},
  {no:5,s:"A",q:"Apakah fungsi =AVERAGE(D6:D45) dalam konteks senarai markah 40 pelajar?",t:"mc",o:["Mengira jumlah semua markah","Mengira markah tertinggi","Mengira purata markah 40 pelajar","Mengira bilangan pelajar"],a:2},
  {no:6,s:"A",q:"Fungsi =TRIM(A6) dalam spreadsheet digunakan untuk:",t:"mc",o:["Memotong teks kepada panjang tertentu","Membuang ruang berlebihan dari teks","Menukar teks kepada huruf besar","Mencari dan menggantikan teks"],a:1},
  {no:7,s:"A",q:"Conditional Formatting memadamkan data dalam sel apabila syarat dipenuhi.",t:"tf",a:"salah"},
  {no:8,s:"A",q:"=PROPER(\"ahmad faris bin ahmad\") akan menghasilkan 'Ahmad Faris Bin Ahmad'.",t:"tf",a:"benar"},
  {no:9,s:"B",q:"Formula untuk mengira bilangan pelajar yang mendapat markah >= 80 dalam julat D6:D45 ialah:",t:"mc",o:["=COUNT(D6:D45,\">=80\")","=COUNTIF(D6:D45,\">80\")","=COUNTIF(D6:D45,\">=80\")","=SUM(D6:D45,\">=80\")"],a:2},
  {no:10,s:"B",q:"En. Razif ingin kira purata markah Matematik HANYA untuk pelajar kelas Ibnu Khaldun. Formula yang betul:",t:"mc",o:["=AVERAGE(E6:E45)","=AVERAGEIF(D6:D45,\"Ibnu Khaldun\",E6:E45)","=SUMIF(D6:D45,\"Ibnu Khaldun\")","=AVERAGEIFS(E6:E45)"],a:1},
  {no:11,s:"B",q:"Dalam =VLOOKUP(A6,'Senarai Master'!A:H,2,FALSE) - angka '2' bermaksud:",t:"mc",o:["Cari nilai di baris ke-2","Pulangkan nilai dari lajur ke-2 jadual rujukan","Cari 2 nilai serentak","Gunakan 2 syarat carian"],a:1},
  {no:12,s:"B",q:"Apakah kelebihan XLOOKUP berbanding VLOOKUP?",t:"mc",o:["XLOOKUP lebih cepat dikira","XLOOKUP boleh mencari ke KIRI dan mengembalikan pelbagai lajur","XLOOKUP tidak perlu nama lajur","XLOOKUP hanya untuk nombor"],a:1},
  {no:13,s:"B",q:"Formula COUNTIFS yang betul untuk kira pelajar Perempuan yang gagal kurang dari 50 markah:",t:"mc",o:["=COUNTIFS(C:C,\"Perempuan\",F:F,<50)","=COUNTIFS(C:C,\"Perempuan\",F:F,\"<50\")","=COUNTIF(F:F,\"<50\"+C:C,\"Perempuan\")","=SUMIFS(F:F,C:C,\"Perempuan\")"],a:1},
  {no:14,s:"B",q:"Pivot Table boleh merumuskan data 1,000 baris dalam masa kurang dari 1 minit tanpa sebarang formula.",t:"tf",a:"benar"},
  {no:15,s:"B",q:"Dalam Pivot Table, 'Values' field digunakan untuk:",t:"mc",o:["Menentukan nama lajur dalam pivot","Menapis data yang dipaparkan","Menentukan jenis pengiraan (SUM, AVERAGE, COUNT)","Menetapkan warna jadual"],a:2},
  {no:16,s:"B",q:"Jenis Conditional Formatting yang menunjukkan bar mini dalam sel (mirip carta bar kecil) ialah:",t:"mc",o:["Color Scale","Icon Sets","Data Bars","Top/Bottom Rules"],a:2},

function si(num,title,sub,done,type,extra,action){

  return `<div class="step-item">
    <div class="step-num ${cls}">${done?'&#10003;':num}</div>
    <div style="flex:1">
      <div class="step-title">${title}</div>

// TEST
function tTest(){
  const isP=S.testMode==='post';
  const ans=isP?S.postAns:S.preAns;
  const q=QS[S.qIdx];
  const answered=Object.keys(ans).length;
  const prev=S.qIdx>0?QS[S.qIdx-1]:null;
  const showB=!prev||prev.s!==q.s;
  const secMap={A:{cls:'sec-a',lbl:'Bahagian A - Mudah (1-8)'},
                B:{cls:'sec-b',lbl:'Bahagian B - Sederhana (9-18)'},
                C:{cls:'sec-c',lbl:'Bahagian C - Senario (19-25)'}};
  const sec=secMap[q.s];
  return `
  <div class="test-hdr">
    <button class="btn btn-ghost btn-sm" onclick="S.view='home';sv();render()">&larr; Kembali</button>
    <span class="test-tag">${isP?'Post-Test':'Pre-Test'} &middot; ${answered}/25 dijawab</span>
  </div>
  <div class="prog-wrap"><div class="prog-bar" style="width:${Math.round(S.qIdx/25*100)}%"></div></div>
  <div class="prog-meta"><span>Soalan ${S.qIdx+1} / 25</span><span>${Math.round(S.qIdx/25*100)}%</span></div>
  <div class="card" style="margin-top:10px">
    ${showB?`<div class="q-sec-banner ${sec.cls}">${sec.lbl}</div>`:''}
    <div class="q-text">${q.no}. ${q.q}</div>
    ${q.t==='mc'?q.o.map((o,i)=>`<div class="opt ${ans[q.no]===i?'selected':''}" onclick="pa(${q.no},${i})">
      <div class="opt-letter">${String.fromCharCode(65+i)}</div><span>${o}</span></div>`).join(''):`
    <div class="tf-row">
      <button class="tf-btn ${ans[q.no]==='benar'?'selected':''}" onclick="pa(${q.no},'benar')">&#10003; BENAR</button>
      <button class="tf-btn ${ans[q.no]==='salah'?'selected':''}" onclick="pa(${q.no},'salah')">&#10007; SALAH</button>
    </div>`}
  </div>
  <div style="display:flex;gap:9px;justify-content:space-between;margin-top:5px">
    ${S.qIdx>0?`<button class="btn" onclick="gq(${S.qIdx-1})">&larr; Sebelum</button>`:'<div></div>'}
    ${S.qIdx<24?`<button class="btn btn-primary" onclick="gq(${S.qIdx+1})">Seterusnya &rarr;</button>`:
      `<button class="btn btn-mint" onclick="dsub()">Hantar Ujian &#10003;</button>`}
  </div>
  <div style="margin-top:16px">
    <div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:7px">Navigasi Soalan</div>
    <div class="q-nav">
      ${QS.map((qq,i)=>`<button class="q-dot ${i===S.qIdx?'active':ans[qq.no]!==undefined?'done':''}" onclick="gq(${i})">${qq.no}</button>`).join('')}
    </div>
  </div>`;}
function pa(no,val){const isP=S.testMode==='post';if(isP)S.postAns[no]=val;else S.preAns[no]=val;sv();render();}
function gq(i){S.qIdx=i;render();}
function dsub(){
  const isP=S.testMode==='post';
  const ans=isP?S.postAns:S.preAns;
  const ua=QS.filter(q=>ans[q.no]===undefined).length;
  if(ua>0&&!confirm(ua+' soalan belum dijawab. Hantar sekarang?'))return;
  let sc=0;
  QS.forEach(q=>{const a=ans[q.no];if(q.t==='mc'&&a===q.a)sc++;if(q.t==='tf'&&a===q.a)sc++;});
  if(isP){S.postScore=sc;S.postDone=true;}else{S.preScore=sc;S.preDone=true;}
  saveAll();sv();S.view='results';render();
}

// TRAINER
function tTrainer(){
  const all=gAll();
  const total=all.length;
  const preC=all.filter(p=>p.preDone).length;
  const postC=all.filter(p=>p.postDone).length;
  const avgPre=preC?+(all.filter(p=>p.preDone).reduce((s,p)=>s+(p.preScore||0),0)/preC).toFixed(1):0;
  const avgPost=postC?+(all.filter(p=>p.postDone).reduce((s,p)=>s+(p.postScore||0),0)/postC).toFixed(1):0;
  const gain=avgPost&&avgPre?(avgPost-avgPre).toFixed(1):'&mdash;';
  return `
  <div class="trainer-hdr">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div>
        <div style="font-size:18px;font-weight:800">Trainer Dashboard</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.72)">MRSM Spreadsheet Workshop 2024</div>
      </div>
      <button class="btn btn-sm" style="background:rgba(255,255,255,0.14);color:#fff;border-color:rgba(255,255,255,0.25)" onclick="S.view='register';render()">Keluar</button>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px">
    ${[['Peserta',total,'#fff'],['Pre-Test',preC,'var(--sky)'],['Post-Test',postC,'var(--mint)'],['Gain Avg',gain,'var(--gold)']].map(([l,v,c])=>`
    <div class="kpi" style="background:rgba(106,69,240,0.07)">
      <div class="kpi-val" style="font-size:18px;color:${c}">${v}</div>
      <div class="kpi-lbl">${l}</div>
    </div>`).join('')}
  </div>
  <div class="card" style="padding:14px;overflow-x:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;flex-wrap:wrap;gap:7px">
      <div style="font-size:15px;font-weight:700">Rekod Peserta (${total})</div>
      <div style="display:flex;gap:7px">
        <button class="btn btn-sm" onclick="addDemo()">+ Demo</button>
        <button class="btn btn-mint btn-sm" onclick="doExp()">Eksport CSV</button>
      </div>
    </div>
    <table class="data-table">
      <thead><tr>
        <th>Nama</th><th>MRSM</th><th>Pre</th><th>Post</th><th>Gain</th><th>Modul</th><th>Trophy</th>
      </tr></thead>
      <tbody>
        ${all.length===0?`<tr><td colspan="7" style="text-align:center;padding:22px;color:var(--muted)">Tiada peserta lagi. Klik "+ Demo" untuk preview.</td></tr>`
        :all.map(p=>{
          const md=Object.values(p.mods||{}).filter(v=>v).length;
          const trophy=md===7&&p.preDone&&p.postDone;
          const g=p.preScore!=null&&p.postScore!=null?(p.postScore-p.preScore):null;
          return `<tr>
            <td style="font-weight:600">${p.name}</td>
            <td style="color:var(--muted)">${p.mrsm}</td>
            <td>${p.preDone?`<span class="pill pill-done">${p.preScore}/25</span>`:'<span class="pill pill-no">&mdash;</span>'}</td>
            <td>${p.postDone?`<span class="pill" style="background:rgba(0,212,161,0.12);color:#006649">${p.postScore}/25</span>`:'<span class="pill pill-no">&mdash;</span>'}</td>
            <td>${g!==null?`<span class="${g>=0?'gain-pos':'gain-neg'}">${g>=0?'+':''}${g}</span>`:'&mdash;'}</td>
            <td><div style="display:flex;gap:2px">${[1,2,3,4,5,6,7].map(i=>`<span style="font-size:13px" title="${BADGES[i-1].name}">${(p.mods||{})[i]?BADGES[i-1].ico:'&#9633;'}</span>`).join('')}</div></td>
            <td style="text-align:center;font-size:17px">${trophy?'&#127942;':'&mdash;'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;}

function gAll(){try{return JSON.parse(localStorage.getItem('ws24all')||'[]');}catch(e){return[];}}
function saveAll(){
  if(!S.p)return;
  let all=gAll();
  const i=all.findIndex(p=>p.name===S.p.name&&p.mrsm===S.p.mrsm);
  const rec={name:S.p.name,mrsm:S.p.mrsm,subj:S.p.subj,at:S.p.at,
    preScore:S.preScore,postScore:S.postScore,preDone:S.preDone,postDone:S.postDone,mods:S.mods};
  if(i>=0)all[i]=rec;else all.push(rec);
  try{localStorage.setItem('ws24all',JSON.stringify(all));}catch(e){}
}
function addDemo(){
  let all=gAll();
  const demos=[
    {name:'Siti Rahmah bt Zulkifli',mrsm:'MRSM Mersing',subj:'Matematik',preScore:14,postScore:21,preDone:true,postDone:true,mods:{1:'https://drive.google.com',2:'https://drive.google.com',3:'https://drive.google.com',4:null,5:null,6:null,7:null}},
    {name:'Ahmad Faris bin Hassan',mrsm:'MRSM Kuantan',subj:'Sains',preScore:18,postScore:24,preDone:true,postDone:true,mods:{1:'ok',2:'ok',3:'ok',4:'ok',5:'ok',6:'ok',7:'ok'}},
    {name:'Muhammad Hazwan',mrsm:'MRSM Taiping',subj:'Geografi',preScore:10,postScore:16,preDone:true,postDone:true,mods:{1:'ok',2:null,3:null,4:null,5:null,6:null,7:null}},
    {name:'Nur Izzati bt Mansor',mrsm:'MRSM KK',subj:'BI',preScore:22,postScore:25,preDone:true,postDone:true,mods:{1:'ok',2:'ok',3:'ok',4:'ok',5:'ok',6:'ok',7:'ok'}},
  ];
  demos.forEach(d=>{if(!all.find(p=>p.name===d.name))all.push({...d,at:new Date().toISOString()});});
  try{localStorage.setItem('ws24all',JSON.stringify(all));}catch(e){}
  render();
}
function doExp(){
  const all=gAll();if(!all.length){alert('Tiada data.');return;}
  const rows=[['Nama','MRSM','Mata Pelajaran','Pre-Test','Post-Test','Gain','Sesi1','Sesi2','Sesi3','Sesi4','Sesi5','Sesi6','Sesi7','Trophy','Tarikh']];
  all.forEach(p=>{
    const md=Object.values(p.mods||{}).filter(v=>v).length;
    const trophy=md===7&&p.preDone&&p.postDone?'Ya':'Tidak';
    const gain=p.preScore!=null&&p.postScore!=null?p.postScore-p.preScore:'';
    rows.push([p.name,p.mrsm,p.subj||'',p.preDone?p.preScore:'',p.postDone?p.postScore:'',gain,
      ...[1,2,3,4,5,6,7].map(i=>(p.mods||{})[i]?'Ya':'Tidak'),trophy,p.at&&p.at.split('T')[0]||'']);
  });
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='MRSM_Workshop_Rekod.csv';a.click();
}

if(!S.p){S.view='register';}else if(S.view==='register'){S.view='home';}
render();
</script>
</body>
</html>
